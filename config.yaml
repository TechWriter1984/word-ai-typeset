# =====================================================================
#  Word AI 自动排版 + 模板合并 - 全局配置
#  所有可调参数集中于此，方便用户一次性配置
# =====================================================================

# ---- 文件路径 ----
paths:
  # 样式模板（含 [SectionName: BodyText] 标记的官方模板）
  template_docx: "D:\\github_repos\\word-ai-typeset\\raw_en_20260616.docx"
  # 步骤2 输入：用户在前处理后保存的 docx（仅作默认值，实际由 main.py 命令行传入）
  input_docx: "D:\\github_repos\\word-ai-typeset\\input\\待排版.docx"
  # 输出目录（中间产物 + 最终合并文件）
  output_dir: "D:\\github_repos\\word-ai-typeset\\output"
  # API Key 文件
  key_file: "D:\\github_repos\\word-ai-typeset\\key.txt"

# ---- 模板正文节标记 ----
template:
  # 模板中标记正文节的关键字，与 [SectionName: BodyText] 中的 BodyText 一致
  section_marker: "BodyText"
  # 合并前是否清空正文节占位内容（与原 VBA 清空正文占位内容 一致）
  clear_placeholder: true
  # 语种模板名（按源文档语种自动选择，与原 VBA 一致）
  cn_template: "raw_cn_20260616.docx"
  en_template: "raw_en_20260616.docx"

# ---- DeepSeek 大模型配置 ----
llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.0
  # 批量输出 JSON 标签所需 token 上限
  max_tokens: 1024
  timeout: 30
  # 分类批大小（一次请求分类多少段落，节省 token）
  batch_size: 20

# ---- LLM 分类标签 → Word 自定义样式名 映射 ----
style_map:
  H1: "heading 1"
  H2: "heading 2"
  H3: "heading 3"
  H4: "heading 4"
  H5: "heading 5"
  H6: "heading 6"
  H7: "heading 7"
  H8: "heading 8"
  H9: "heading 9"
  BODY: "_全文正文格式_hs"
  BULLET: "_项目符号列表1级_圆点_hs"
  NUM: "_编号1_(1级)_hs"
  TABLE_HEADER: "_表格_表头标题行_hs"
  TABLE_BODY: "_表格_正文格式_hs"
  CODE: "_代码字体_hs"
  IMAGE: "_图_hs"
  CAPTION: "_图_题注_hs"

# ---- 步骤2 排版行为 ----
typeset:
  max_text_len: 500
  skip_blank: true
  fallback_label: "BODY"
  # 步骤2阶段是否执行 format_tables/format_images（推荐 false，统一在 post_process 合并后执行，
  # 此时才能知道哪些块属于 BodyText 节、哪些是封面/Symbol节，避免误处理Logo/Icon）
  stage2_format_tables: false
  stage2_format_images: false

# ---- 增强排版 + 后处理开关 ----
features:
  # ===== 合并前（typeset 阶段）=====
  # 清理标题多余编号：仅当标题已有自动编号(numPr)时，删除文本开头的手动编号
  clean_heading_numbers: true

  # ===== 合并后（post_process 阶段）=====
  # 删除每一节的 [SectionName: XXX] 标记行（CoverPage/SymbolAndTerm/BodyText 等全部）
  remove_all_section_markers: true
  # 大模型分析正文后，替换模板遗留的 {{XXX}} 占位符（失败不中断，留空值）
  replace_placeholders: true
  # 更新术语表（"术语解释" 或 "EXPLANATION OF TERMS" 标题下表格）：
  #   双语种搜索 BodyText 正文匹配术语 Acronym 列，未使用行删除，保留行字体变黑
  update_terms_table: true
  # 所有表格（包括术语表/SYMBOL表）单元格文字颜色强制设为黑色
  blacken_tables: true

  # 批量表格排版（合并后执行：仅 BodyText 节内表格，表头水平居中+重复标题行，内容中部左对齐；表头=灰底D1D1D1，全框线0.5pt，autofit）
  format_tables: true
  # 批量图片排版（合并后执行：仅 BodyText 节范围内 + 尺寸>Logo×1.3 才处理，居中+边框+_图_hs+题注）
  format_images: true
  # 题注语种：true=中文"图 X-Y"，false=英文"Figure X-Y"
  caption_chinese: true
